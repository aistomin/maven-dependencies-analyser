# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "maven" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"
    ignore:
      # Pinned to the oldest supported Maven (${mvnMinVersion} in pom.xml, also
      # published as <prerequisites>). They are provided by the user's Maven at
      # runtime, so we compile against the floor on purpose. Raising them means
      # dropping support for older Maven - a deliberate decision, never an
      # automatic version bump.
      - dependency-name: "org.apache.maven:maven-model"
      - dependency-name: "org.apache.maven:maven-plugin-api"
      - dependency-name: "org.apache.maven:maven-artifact"
  - package-ecosystem: "github-actions"
    directory: "/" # Dependabot always scans .github/workflows from the root
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      include: "scope"
